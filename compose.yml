services:
  bot:
    build: .
    image: ghcr.io/esmbot/esmbot:edge
    restart: unless-stopped
    # lets the container reach services on the host, such as a local postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./bot-help:/app/help
      - ${TEMP_MOUNT:-./bot-temp}:/app/temp
      - ./config:/app/config
      - ./db:/app/db
    env_file:
      - .env
    environment:
      OUTPUT: /app/help/help.md
      TEMPDIR: /app/temp
    links:
      - lavalink
    depends_on:
      lavalink:
        condition: service_healthy

  lavalink:
    container_name: lavalink
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
      - lavaplugins:/opt/Lavalink/plugins/
    healthcheck:
      test: 'curl -H "Authorization: $$(cat /opt/Lavalink/application.yml | grep password: | sed ''s/^ *password: //g'' | tr -d ''"'')" -f http://localhost:2333/version'
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  lavaplugins:
